<style>
text{font-family:'Segoe UI Symbol','Apple Symbols','DejaVu Sans','Noto Sans Symbols2',sans-serif}
.n{animation:rise linear infinite;opacity:0}
@keyframes rise{0%{transform:translate(0,0) rotate(-8deg);opacity:0}10%{opacity:.9}50%{transform:translate(18px,-90px) rotate(8deg)}90%{opacity:.9}100%{transform:translate(-6px,-190px) rotate(-8deg);opacity:0}}
.t{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-weight:700;text-anchor:middle}
.glow{animation:glow 3s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.85}50%{opacity:1}}
.b{transform-box:fill-box;transform-origin:bottom;animation:eq ease-in-out infinite}
@keyframes eq{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
.w{animation:wave 2.4s ease-in-out infinite}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
</style>
