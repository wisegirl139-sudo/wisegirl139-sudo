.tree{fill:#2ea043}.trunk{fill:#8b5a2b}
.star{fill:#ffd23f;font-size:26px;animation:pulse 1.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(1.25)}}
.l{animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
.s{fill:#cfe8ff;animation:fall linear infinite}
@keyframes fall{from{transform:translateY(-20px)}to{transform:translateY(480px)}}
.msg{fill:#9ecbff;font-size:15px}
</style>
