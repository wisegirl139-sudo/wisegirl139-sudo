<svg xmlns="http://www.w3.org/2000/svg" width="900" height="70" viewBox="0 0 900 70">
<style>
text{font-family:'Segoe UI Symbol','Apple Symbols','DejaVu Sans','Noto Sans Symbols2',sans-serif}
.n{animation:rise linear infinite;opacity:0}
@keyframes rise{0%{transform:translate(0,0) rotate(-8deg);opacity:0}10%{opacity:.9}50%{transform:translate(18px,-90px) rotate(8deg)}90%{opacity:.9}100%{transform:translate(-6px,-190px) rotate(-8deg);opacity:0}}
.t{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-weight:700;text-anchor:middle}
.glow{animation:glow 3s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.85}50%{opacity:1}}
.b{transform-box:fill-box;transform-origin:bottom;animation:eq ease-in-out infinite}
@keyframes eq{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
.w{animation:wave 2.4s ease-in-out infinite}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
</style>
<text class="w" x="25" y="45" font-size="28" fill="#ff7bd5" style="animation-delay:0.00s">♪</text>
<text class="w" x="75" y="45" font-size="28" fill="#4da6ff" style="animation-delay:-0.25s">♫</text>
<text class="w" x="125" y="45" font-size="28" fill="#ffd23f" style="animation-delay:-0.50s">♬</text>
<text class="w" x="175" y="45" font-size="28" fill="#2ea043" style="animation-delay:-0.75s">♩</text>
<text class="w" x="225" y="45" font-size="28" fill="#c792ea" style="animation-delay:-1.00s">♪</text>
<text class="w" x="275" y="45" font-size="28" fill="#ff6b6b" style="animation-delay:-1.25s">♫</text>
<text class="w" x="325" y="45" font-size="28" fill="#ff7bd5" style="animation-delay:-1.50s">♪</text>
<text class="w" x="375" y="45" font-size="28" fill="#4da6ff" style="animation-delay:-1.75s">♫</text>
<text class="w" x="425" y="45" font-size="28" fill="#ffd23f" style="animation-delay:-2.00s">♬</text>
<text class="w" x="475" y="45" font-size="28" fill="#2ea043" style="animation-delay:-2.25s">♩</text>
<text class="w" x="525" y="45" font-size="28" fill="#c792ea" style="animation-delay:-2.50s">♪</text>
<text class="w" x="575" y="45" font-size="28" fill="#ff6b6b" style="animation-delay:-2.75s">♫</text>
<text class="w" x="625" y="45" font-size="28" fill="#ff7bd5" style="animation-delay:-3.00s">♪</text>
<text class="w" x="675" y="45" font-size="28" fill="#4da6ff" style="animation-delay:-3.25s">♫</text>
<text class="w" x="725" y="45" font-size="28" fill="#ffd23f" style="animation-delay:-3.50s">♬</text>
<text class="w" x="775" y="45" font-size="28" fill="#2ea043" style="animation-delay:-3.75s">♩</text>
<text class="w" x="825" y="45" font-size="28" fill="#c792ea" style="animation-delay:-4.00s">♪</text>
<text class="w" x="875" y="45" font-size="28" fill="#ff6b6b" style="animation-delay:-4.25s">♫</text>
</svg>